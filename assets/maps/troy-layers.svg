<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Diagram of the nine archaeological layers of Troy"><rect width="1200" height="720" rx="26" fill="#f7f1e6"/><text x="60" y="72" font-family="Georgia,serif" font-size="44" fill="#0d2b43">Nine cities stacked on one hill</text><g font-family="Arial,sans-serif"><rect x="110" y="110" width="980" height="45" rx="12" fill="#6c4b3a"/><text x="135" y="141" font-size="22" fill="#fff" font-weight="700">Troy 9</text><text x="285" y="141" font-size="20" fill="#fff">Roman city and monumental rebuilding</text><rect x="110" y="167" width="980" height="45" rx="12" fill="#78533d"/><text x="135" y="198" font-size="22" fill="#fff" font-weight="700">Troy 8</text><text x="285" y="198" font-size="20" fill="#fff">Greek sanctuary and renewed cult</text><rect x="110" y="224" width="980" height="45" rx="12" fill="#865e43"/><text x="135" y="255" font-size="22" fill="#fff" font-weight="700">Troy 7</text><text x="285" y="255" font-size="20" fill="#fff">Late Bronze Age destruction and resettlement</text><rect x="110" y="281" width="980" height="45" rx="12" fill="#936a49"/><text x="135" y="312" font-size="22" fill="#fff" font-weight="700">Troy 6</text><text x="285" y="312" font-size="20" fill="#fff">Possible horizon behind Homeric memory</text><rect x="110" y="338" width="980" height="45" rx="12" fill="#a47751"/><text x="135" y="369" font-size="22" fill="#fff" font-weight="700">Troy 5</text><text x="285" y="369" font-size="20" fill="#fff">Great Bronze Age citadel and sloping walls</text><rect x="110" y="395" width="980" height="45" rx="12" fill="#b18358"/><text x="135" y="426" font-size="22" fill="#fff" font-weight="700">Troy 4</text><text x="285" y="426" font-size="20" fill="#fff">Middle Bronze Age rebuilding</text><rect x="110" y="452" width="980" height="45" rx="12" fill="#bd9161"/><text x="135" y="483" font-size="22" fill="#fff" font-weight="700">Troy 3</text><text x="285" y="483" font-size="20" fill="#fff">Early Bronze Age town</text><rect x="110" y="509" width="980" height="45" rx="12" fill="#caa16e"/><text x="135" y="540" font-size="22" fill="#fff" font-weight="700">Troy 2</text><text x="285" y="540" font-size="20" fill="#fff">Schliemann’s “Priam’s Treasure” layer</text><rect x="110" y="566" width="980" height="45" rx="12" fill="#d7b47d"/><text x="135" y="597" font-size="22" fill="#fff" font-weight="700">Troy 1</text><text x="285" y="597" font-size="20" fill="#fff">First settlement on Hisarlık</text></g><text x="112" y="664" font-family="Arial,sans-serif" font-size="20" fill="#63717d">The archaeological labels simplify a complex sequence of phases and sub-phases.</text></svg>