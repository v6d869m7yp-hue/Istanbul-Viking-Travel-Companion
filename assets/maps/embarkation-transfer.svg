<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">embarkation-transfer.svg</title><desc id="d">Custom offline route diagram for the Istanbul Viking Travel Companion.</desc><style>
.bg{fill:#f5efe3}.water{fill:#b9dbe6}.land{fill:#e9dfcb}.road{fill:none;stroke:#c3aa7b;stroke-width:5;stroke-linecap:round}.route{fill:none;stroke:#b45b3c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 9}.ferry{fill:none;stroke:#16718e;stroke-width:5;stroke-linecap:round;stroke-dasharray:10 8}.pin{fill:#0d2b43;stroke:#fff;stroke-width:3}.hotel{fill:#b45b3c;stroke:#fff;stroke-width:3}.label{font:600 18px system-ui,sans-serif;fill:#0d2b43}.small{font:500 14px system-ui,sans-serif;fill:#415a68}.title{font:700 28px Georgia,serif;fill:#0d2b43}.num{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.legend{fill:#fff;stroke:#d6c9b2;stroke-width:1}.line{stroke:#7a8e96;stroke-width:2}.green{fill:#b7cfad}.sand{fill:#d9c7a5}
</style><rect class="bg" width="1200" height="700"/><path class="water" d="M0 500 C280 455 520 550 760 500 S1030 450 1200 475 V700 H0Z"/><path class="road" d="M180 440 C320 355 470 325 610 345 S870 405 1040 455"/><path class="route" d="M180 440 C320 355 470 325 610 345 S870 405 1040 455"/><text class="title" x="55" y="65">Hotel to Embarkation: Transfer Framework</text><text class="small" x="58" y="94">Use the final Viking terminal notice as the authority; Istanbul port assignments can change.</text><g transform="translate(180 440)"><circle class="hotel" r="19"/><text class="num" y="1">H</text><text class="label" x="30" y="6">Dersaadet Hotel</text></g><g transform="translate(610 345)"><circle class="pin" r="17"/><text class="num" y="1">T</text><text class="label" x="28" y="6">Transfer checkpoint</text></g><g transform="translate(1040 455)"><circle class="pin" r="19"/><text class="num" y="1">S</text><text class="label" x="-185" y="48">Confirmed ship terminal</text></g><rect class="legend" x="55" y="130" rx="14" width="470" height="155"/><text class="small" x="80" y="165">1. Confirm terminal in My Viking Journey / hotel desk.</text><text class="small" x="80" y="198">2. Ask driver to use the exact terminal entrance.</text><text class="small" x="80" y="231">3. Keep passports and cruise documents in hand luggage.</text><text class="small" x="80" y="264">4. Allow a traffic buffer; do not rely on walking with luggage.</text></svg>