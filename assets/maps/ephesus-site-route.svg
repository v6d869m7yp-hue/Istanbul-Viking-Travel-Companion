<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f5efe3"/><text x="60" y="70" font-family="Georgia" font-size="36" fill="#0d2b43">Ephesus: Upper Gate to Lower Gate</text><text x="60" y="108" font-family="Arial" font-size="18" fill="#68727a">Schematic visitor route · not to scale</text><path d="M165 185 C280 225 330 315 435 350 S620 405 710 490 S880 575 1030 635" fill="none" stroke="#b67a36" stroke-width="18" stroke-linecap="round"/><g font-family="Arial" font-size="18" fill="#0d2b43"><g><circle cx="165" cy="185" r="26" fill="#0d2b43"/><text x="210" y="177" font-weight="700">Upper Gate</text><text x="210" y="202" fill="#68727a">Start / coach drop</text></g><g><circle cx="315" cy="285" r="24" fill="#0d2b43"/><text x="350" y="277" font-weight="700">Odeon</text><text x="350" y="302" fill="#68727a">Civic quarter</text></g><g><circle cx="475" cy="370" r="24" fill="#0d2b43"/><text x="510" y="362" font-weight="700">Curetes Street</text><text x="510" y="387" fill="#68727a">Steep marble descent</text></g><g><circle cx="650" cy="455" r="24" fill="#b67a36"/><text x="685" y="447" font-weight="700">Terrace Houses</text><text x="685" y="472" fill="#68727a">Covered stairs · optional loop</text></g><g><circle cx="775" cy="525" r="28" fill="#0d2b43"/><text x="815" y="517" font-weight="700">Library of Celsus</text><text x="815" y="542" fill="#68727a">Main photographic stop</text></g><g><circle cx="920" cy="595" r="24" fill="#0d2b43"/><text x="955" y="587" font-weight="700">Great Theatre</text><text x="955" y="612" fill="#68727a">Climb only if energy allows</text></g><g><circle cx="1030" cy="635" r="26" fill="#0d2b43"/><text x="860" y="695" font-weight="700">Lower Gate / meeting point</text></g></g><g font-family="Arial" font-size="16"><rect x="65" y="620" width="290" height="82" rx="16" fill="#fff" stroke="#d7cdbd"/><text x="88" y="650" fill="#0d2b43" font-weight="700">Heat-smart pacing</text><text x="88" y="678" fill="#68727a">Shad