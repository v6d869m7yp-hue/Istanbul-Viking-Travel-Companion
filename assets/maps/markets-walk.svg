</style><rect class="bg" width="1200" height="700"/><path class="water" d="M0 555 C350 520 650 600 1200 535 V700 H0Z"/><path class="road" d="M160 520 L300 430 L490 360 L670 285 L900 200"/><path class="road" d="M300 430 L390 510 L560 470 L720 395"/><path class="route" d="M165 520 L300 430 L490 360 L670 285 L900 200"/><text class="title" x="55" y="65">Markets Walk: Spice Bazaar to Grand Bazaar</text><text class="small" x="58" y="94">Approx. 1.4 miles one way • uphill toward the Grand Bazaar • allow 2–4 hours</text>
