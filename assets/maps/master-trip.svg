<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">master-trip.svg</title><desc id="d">Custom offline route diagram for the Istanbul Viking Travel Companion.</desc><style>
.bg{fill:#f5efe3}.water{fill:#b9dbe6}.land{fill:#e9dfcb}.road{fill:none;stroke:#c3aa7b;stroke-width:5;stroke-linecap:round}.route{fill:none;stroke:#b45b3c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 9}.ferry{fill:none;stroke:#16718e;stroke-width:5;stroke-linecap:round;stroke-dasharray:10 8}.pin{fill:#0d2b43;stroke:#fff;stroke-width:3}.hotel{fill:#b45b3c;stroke:#fff;stroke-width:3}.label{font:600 18px system-ui,sans-serif;fill:#0d2b43}.small{font:500 14px system-ui,sans-serif;fill:#415a68}.title{font:700 28px Georgia,serif;fill:#0d2b43}.num{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.legend{fill:#fff;stroke:#d6c9b2;stroke-width:1}.line{stroke:#7a8e96;stroke-width:2}.green{fill:#b7cfad}.sand{fill:#d9c7a5}
</style><rect class="bg" width="1200" height="700"/><text class="title" x="55" y="65">Full Journey at a Glance</text><path class="route" d="M100 380 C250 210 380 210 500 340 S720 535 850 390 S1020 210 1110 300"/><g transform="translate(100 380)"><circle class="pin" r="22"/><text class="num" y="1">1</text><text class="label" x="-25" y="55">California</text></g><g transform="translate(330 250)"><circle class="pin" r="22"/><text class="num" y="1">2</text><text class="label" x="-38" y="55">Istanbul</text></g><g transform="translate(600 450)"><circle class="pin" r="22"/><text class="num" y="1">3</text><text class="label" x="-58" y="55">Viking voyage</text></g><g transform="translate(850 390)"><circle class="pin" r="22"/><text class="num" y="1">4</text><text class="label" x="-28" y="55">Venice</text></g><g transform="translate(1110 300)"><circle class="pin" r="22"/><text class="num" y="1">5</text><text class="label" x="-75" y="55">Northern Italy</text></g><rect class="legend" x="55" y="520" rx="14" width="1090" height="105"/><text class="small" x="85" y="557">Aug 13 departure → Aug 14–18 Istanbul → Aug 18 embarkation → Aug 19–31 cruise → Sept 1 Northern Italy.</text><text class="small" x="85" y="592">This map is designed as a chapter navigator, not a scale map.</text></svg>